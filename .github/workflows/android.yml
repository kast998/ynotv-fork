name: android
on:
  push:
    tags: ['android-*']
  workflow_dispatch:
permissions:
  contents: write
env:
  UPSTREAM_SHA: aa30eb047c749fe5a96dd47b94947cda2421354f
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: ynotv
      - name: Fetch FongMi/TV
        run: |
          git init tv && cd tv
          git remote add origin https://github.com/FongMi/TV
          git fetch --depth 1 origin $UPSTREAM_SHA
          git checkout FETCH_HEAD
      - name: Apply ynoTV changes
        working-directory: tv
        run: |
          cp -r ../ynotv/android/overlay/. .
          python3 ../ynotv/android/patch.py
          cp ../ynotv/android/ynotv.p12 app/ynotv.p12
          printf "storeFile=ynotv.p12\nkeyAlias=ynotv\nstorePassword=ynotv-android\n" > local.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: tv
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleMobileRelease --stacktrace --no-configuration-cache
      - name: Collect
        run: |
          mkdir out
          find tv/app/build/outputs -name "*.apk" -print -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          make_latest: false
          name: ynoTV Android ${{ github.ref_name }}
          body: ynoTV Android (FongMi/TV + built-in YouTube). Most phones use the arm64-v8a APK.
