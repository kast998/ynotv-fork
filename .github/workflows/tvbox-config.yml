name: tvbox-config
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/tvbox/merge.py', 'android/tvbox/youtube.js']
permissions:
  contents: write
concurrency: tvbox-config
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install cryptography json5
      - run: python3 android/tvbox/merge.py
      - name: Commit
        run: |
          git config user.name "ynotv-bot"
          git config user.email "ynotv-bot@users.noreply.github.com"
          git add android/tvbox/*.json
          git diff --cached --quiet || (git commit -m "tvbox: refresh ynotv.json" && git push)
      - name: Purge jsDelivr
        run: |
          for f in ynotv.json youtube.json youtube.js; do
            curl -s "https://purge.jsdelivr.net/gh/kast998/ynotv-fork@main/android/tvbox/$f" > /dev/null || true
          done
